---
- name: Comprovar el nom de la màquina
  ansible.builtin.assert:
    that:
      - vm_name | length > 0

- name: Consultar l'estat de la màquina
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_info
  changed_when: false

- name: Aturar la màquina
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - controlvm
      - "{{ vm_name }}"
      - acpipowerbutton
  when: "'VMState=\"running\"' in vm_info.stdout"
  changed_when: true

- name: Esperar que la màquina estigui apagada
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_state
  changed_when: false
  until: "'VMState=\"poweroff\"' in vm_state.stdout"
  retries: "{{ vm_shutdown_retries }}"
  delay: "{{ vm_shutdown_delay }}"
  when: "'VMState=\"running\"' in vm_info.stdout"
