- name: Inicializar reservas Terraform
  ansible.builtin.set_fact:
    kea_terraform_services: []

- name: Obtener servicios del inventario Terraform
  ansible.builtin.set_fact:
    kea_terraform_services: "{{ kea_terraform_services + [servicio] }}"
  vars:
    servicio:
      hostname: "{{ hostvars[item].hostname }}"
      mac: "{{ hostvars[item].vcorp_mac_address }}"
      network: "{{ hostvars[item].vcorp_network }}"
      addresses: "{{ [hostvars[item].vcorp_ipv4_cidr.split('/')[0]] if hostvars[item].vcorp_ipv4_cidr is defined else (terraform_service_ip_assignments | selectattr('hostname', 'equalto', item) | map(attribute='ip_address') | list) }}"
  loop: "{{ groups['terraform_services'] | sort }}"

- name: Generar configuracion Kea desde el inventario
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../../scripts/generate_kea_config.py"
    stdin: "{{ kea_terraform_services | to_json }}"
  delegate_to: localhost
  register: kea_generated
  changed_when: false

- name: Instalar Kea DHCPv4
  ansible.builtin.apt:
    name: kea-dhcp4-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar Kea DHCPv4
  ansible.builtin.copy:
    content: |
      {{ kea_generated.stdout }}
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/kea-dhcp4 -t %s
  notify: Reiniciar Kea

- name: Crear directorio de configuración systemd
  ansible.builtin.file:
    path: /etc/systemd/system/kea-dhcp4-server.service.d
    state: directory
    mode: "0755"

- name: Esperar a que la red esté disponible
  ansible.builtin.copy:
    dest: /etc/systemd/system/kea-dhcp4-server.service.d/network.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target networking.service
      [Service]
      ExecStartPre=/usr/bin/timeout 45 /bin/sh -c 'until ip -4 addr show dev eth0 scope global | grep -q "inet "; do sleep 1; done'
  notify: Reiniciar Kea

- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Activar Kea
  ansible.builtin.systemd_service:
    name: kea-dhcp4-server
    enabled: true
    state: started

- name: Aplicar configuración
  ansible.builtin.meta: flush_handlers
