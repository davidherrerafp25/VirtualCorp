---
- name: Comprovar el nom de la màquina
  ansible.builtin.assert:
    that:
      - vm_name | length > 0

- name: Consultar l'estat de la màquina
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_info
  changed_when: false

- name: Iniciar la màquina
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - startvm
      - "{{ vm_name }}"
      - --type
      - "{{ vm_start_type }}"
  when: "'VMState=\"running\"' not in vm_info.stdout"
  changed_when: true
